<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CivicConnect</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>CivicConnect</h1>
    <div id="session" hidden><span id="whoami"></span> <button id="logout" type="button">Log out</button></div>
  </header>

  <main>
    <p id="message" role="status" hidden></p>

    <!-- FR-07: register / log in -->
    <section id="auth-section">
      <h2>Log in or register</h2>
      <form id="auth-form">
        <label>Email <input name="email" type="email" required autocomplete="username"></label>
        <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
        <p class="hint">At least 8 characters, with upper- and lower-case letters and a number.</p>
        <div class="row">
          <button type="submit" data-action="login">Log in</button>
          <button type="submit" data-action="register" class="secondary">Register</button>
        </div>
      </form>
    </section>

    <!-- FR-01, FR-02, FR-03: citizen report submission -->
    <section id="report-section" hidden>
      <h2>Report a civic issue</h2>
      <form id="report-form">
        <label>Category <select name="category" required></select></label>
        <label>Location <input name="location" maxlength="255" required placeholder="Street address or landmark"></label>
        <label>Description <textarea name="description" maxlength="1000" rows="4" required placeholder="What is the problem?"></textarea></label>
        <button type="submit">Submit report</button>
      </form>
    </section>

    <!-- FR-04: status lookup -->
    <section id="status-section" hidden>
      <h2>Check report status</h2>
      <form id="status-form" class="row">
        <input name="reference" required placeholder="CC-2026-XXXXXX" aria-label="Reference number">
        <button type="submit">Check</button>
      </form>
      <dl id="status-result" hidden></dl>
    </section>

    <!-- FR-05, FR-06: personnel issue management -->
    <section id="staff-section" hidden>
      <h2>Manage reported issues</h2>
      <form id="filter-form" class="row">
        <select name="status" aria-label="Status filter"><option value="">All statuses</option></select>
        <select name="category" aria-label="Category filter"><option value="">All categories</option></select>
        <select name="sort" aria-label="Sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select>
        <button type="submit">Apply</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Reference</th><th>Category</th><th>Location</th><th>Status</th><th>Updated</th><th>Action</th></tr></thead>
          <tbody id="report-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
