# CI Quality Gates implementing Assignment 2 SCM/CI research
# Uses Node 24 LTS and exact scripts defined in the M2 baseline
name: CivicConnect CI Quality Gates

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Clean dependency installation
        run: npm ci
        
      - name: Build workspaces
        run: npm run build
        
      - name: Run automated tests
        run: npm test